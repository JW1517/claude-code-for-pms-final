<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rook Dispatch — Handler Console</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --border:#2a2f3a;
    --text:#e7e9ee; --muted:#8b91a0; --accent:#5b8cff; --green:#3ecf8e;
    --amber:#e0a83e; --red:#e0603e;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 24px; border-bottom:1px solid var(--border); background:var(--panel);
  }
  header .brand{display:flex; align-items:center; gap:10px;}
  header .mark{
    width:26px; height:26px; border-radius:7px; background:var(--accent);
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px;
  }
  header h1{font-size:15px; margin:0; font-weight:600; letter-spacing:.2px;}
  header .sub{color:var(--muted); font-size:12px; margin-top:1px;}
  header .who{text-align:right; font-size:12px; color:var(--muted);}

  nav.tabs{
    display:flex; gap:4px; padding:0 24px; border-bottom:1px solid var(--border);
    background:var(--panel); position:sticky; top:0; z-index:5;
  }
  .tab{
    background:transparent; border:none; border-bottom:2px solid transparent; border-radius:0;
    padding:12px 14px; color:var(--muted); font-weight:600; font-size:13px; cursor:pointer;
  }
  .tab:hover{background:transparent; color:var(--text);}
  .tab.active{color:var(--text); border-bottom-color:var(--accent);}

  main{max-width:1180px; margin:0 auto; padding:22px 24px 60px;}
  .view{display:none;}
  .view.active{display:block;}

  h2.section{
    font-size:12px; text-transform:uppercase; letter-spacing:.6px; color:var(--muted);
    margin:26px 0 12px; font-weight:700;
  }
  h2.section:first-child{margin-top:0;}

  table.roster-table, table.history-table{
    width:100%; border-collapse:collapse; background:var(--panel); border:1px solid var(--border);
    border-radius:10px; overflow:hidden; font-size:12.5px;
  }
  table.roster-table th, table.history-table th{
    text-align:left; padding:9px 12px; color:var(--muted); font-weight:600; font-size:10.5px;
    text-transform:uppercase; letter-spacing:.4px; border-bottom:1px solid var(--border);
  }
  table.roster-table td, table.history-table td{
    padding:9px 12px; border-bottom:1px solid var(--border); vertical-align:middle;
  }
  table.roster-table tr:last-child td, table.history-table tr:last-child td{border-bottom:none;}
  table.roster-table tbody tr, table.history-table tbody tr{cursor:pointer;}
  table.roster-table tbody tr:hover, table.history-table tbody tr:hover{background:var(--panel2);}
  table.roster-table tr.sel{background:rgba(91,140,255,.10);}
  table.roster-table td.handler-cell{color:var(--muted); font-size:11px;}

  .pill{font-size:10px; font-weight:700; padding:3px 8px; border-radius:999px; white-space:nowrap; letter-spacing:.2px;}
  .pill.quiet{background:rgba(224,168,62,.15); color:var(--amber);}
  .pill.busy, .pill.Rising{background:rgba(224,96,62,.15); color:#f0906e;}
  .pill.steady, .pill.Steady, .pill.Falling{background:rgba(139,145,160,.15); color:var(--muted);}

  .cards{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
  @media (max-width:820px){.cards{grid-template-columns:1fr;}}

  .card{
    background:var(--panel); border:1px solid var(--border); border-radius:12px;
    padding:18px; position:relative; overflow:hidden;
  }
  .card.quiet{border-color:#3a3220;}
  .card.busy{border-color:#20303a;}

  .card-top{display:flex; align-items:flex-start; justify-content:space-between; gap:10px;}
  .name{font-size:16px; font-weight:700;}
  .name.click{cursor:pointer;}
  .name.click:hover{text-decoration:underline; text-decoration-color:var(--muted);}
  .meta{font-size:12px; color:var(--muted); margin-top:2px;}

  .badge{
    font-size:11px; font-weight:600; padding:4px 9px; border-radius:999px;
    white-space:nowrap; letter-spacing:.2px;
  }
  .badge.quiet{background:rgba(224,168,62,.15); color:var(--amber); border:1px solid rgba(224,168,62,.35);}
  .badge.busy{background:rgba(224,96,62,.15); color:#f0906e; border:1px solid rgba(224,96,62,.35);}
  .badge.active{background:rgba(62,207,142,.15); color:var(--green); border:1px solid rgba(62,207,142,.35);}
  .badge.pending{background:rgba(91,140,255,.15); color:var(--accent); border:1px solid rgba(91,140,255,.35);}
  .badge.steady{background:rgba(139,145,160,.15); color:var(--muted); border:1px solid rgba(139,145,160,.3);}

  .sparkline{display:flex; align-items:flex-end; gap:3px; height:56px; margin:16px 0 6px;}
  .sparkline.small{height:26px; margin:0;}
  .bar{flex:1; background:var(--border); border-radius:2px 2px 0 0;}
  .bar.hi{background:#3a4252;}
  .spark-labels{display:flex; justify-content:space-between; font-size:10px; color:var(--muted); margin-bottom:14px;}

  .stat-row{display:flex; gap:16px; font-size:11.5px; color:var(--muted); margin-bottom:4px; flex-wrap:wrap;}
  .stat-row b{color:var(--text); display:block; font-size:13px;}

  .kip-line{
    font-size:12px; color:var(--muted); margin-top:14px; padding-top:12px;
    border-top:1px dashed var(--border); font-style:italic;
  }

  .actions{margin-top:16px; display:flex; gap:8px; flex-wrap:wrap;}
  button{
    font:inherit; font-size:12.5px; font-weight:600; cursor:pointer;
    border-radius:8px; padding:9px 14px; border:1px solid var(--border);
    background:var(--panel2); color:var(--text); transition:background .15s, border-color .15s;
  }
  button:hover{background:#262c38;}
  button.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
  button.primary:hover{background:#4a7bef;}
  button.accept{background:var(--green); border-color:var(--green); color:#08221a;}
  button.accept:hover{background:#35b57e;}
  button.decline{background:transparent; border-color:var(--red); color:#f0906e;}
  button.decline:hover{background:rgba(224,96,62,.12);}
  button.ghost{background:transparent; color:var(--muted);}

  .phone{
    margin-top:16px; background:#0b0d11; border:1px solid var(--border);
    border-radius:14px; padding:14px;
  }
  .phone .ptitle{font-size:10px; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); margin-bottom:8px;}
  .phone h4{margin:0 0 4px; font-size:13px;}
  .phone p{margin:0; font-size:11.5px; color:var(--muted); line-height:1.5;}
  .phone-empty{
    margin-top:16px; padding:14px; text-align:center; color:var(--muted); font-size:12px;
    background:#0b0d11; border:1px solid var(--border); border-radius:10px;
  }

  .log{margin-top:16px; padding-top:14px; border-top:1px solid var(--border);}
  .log h3{margin:0 0 10px; font-size:11px; text-transform:uppercase; letter-spacing:.5px; color:var(--muted);}
  .log ul{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px;}
  .log li{font-size:12px; display:flex; gap:10px; align-items:flex-start;}
  .log .t{color:var(--muted); font-variant-numeric:tabular-nums; min-width:48px;}
  .log .empty{color:var(--muted); font-style:italic;}

  .responder-switch{
    display:flex; align-items:center; gap:10px; margin-bottom:18px; font-size:12.5px; color:var(--muted);
  }
  select{
    font:inherit; font-size:12.5px; background:var(--panel2); color:var(--text);
    border:1px solid var(--border); border-radius:8px; padding:8px 10px;
  }

  .avail-row{
    display:flex; align-items:center; justify-content:space-between; font-size:12.5px;
    margin:14px 0; padding:10px 12px; background:var(--panel2); border-radius:8px;
  }
  .toggle-btn{padding:6px 12px; font-size:11.5px;}

  table.mini{width:100%; border-collapse:collapse; font-size:12px; margin-top:12px;}
  table.mini th{
    text-align:left; color:var(--muted); font-weight:600; padding:5px 0;
    border-bottom:1px solid var(--border); font-size:10px; text-transform:uppercase;
  }
  table.mini td{padding:5px 0; border-bottom:1px solid var(--border);}

  .history-controls{display:flex; align-items:center; gap:8px; margin-bottom:14px; font-size:12.5px; color:var(--muted);}
  .sort-btn{padding:6px 12px; font-size:11.5px;}
  .sort-btn.on{background:var(--accent); border-color:var(--accent); color:#fff;}
</style>
</head>

</main>

    return HISTORY.filter(r => r[1] === name).sort((a,b) => a[0] < b[0] ? -1 : 1);

  function fmtDate(iso){
    const [ , m, d ] = iso.split('-');
    return `${+m}/${+d}`;
  }

  function statsFor(name){
    const w = weeksFor(name);
    const last = w[w.length - 1];
    const first = w[0];
    let weeksQuiet = 0;
    for(let i = w.length - 1; i >= 0; i--){
      if(w[i][3] <= 2) weeksQuiet++; else break;
    }
    const quiet = weeksQuiet >= 2;
    const baseline = (w[0][3] + w[1][3] + w[2][3]) / 3;
    const recent = (w[w.length-1][3] + w[w.length-2][3]) / 2;
    let trend = 'Steady';

      if(recent >= baseline * 1.3) trend = 'Rising';
      else if(recent <= baseline * 0.75) trend = 'Falling';
    } else {
      trend = 'Quiet';

      weeks: w, first, last, weeksQuiet, quiet, trend,
      lastSent: last[3], lastTaken: last[4],

  // ---- per-responder interactive state (availability + the Meteor Mite offer flow) ----
  const responderState = {};
  RESPONDERS.forEach(name => {
    responderState[name] = { availability: 'available', offerStatus: 'none', log: [] };
  });

  const state = { view: 'handler', selectedHandler: 'Kip', selectedResponder: 'Meteor Mite', historySort: 'name' };

  function sparkHTML(weeks, maxHeight = 56){
    const max = Math.max(...weeks.map(w => w[3]), 1);
    return weeks.map(w => {
      const h = Math.max(3, Math.round((w[3] / max) * maxHeight));
      const hi = w[3] >= max * 0.6 ? 'hi' : '';
      return `<div class="bar ${hi}" style="height:${h}px" title="${fmtDate(w[0])}: ${w[3]} sent, ${w[4]} taken"></div>`;
    }).join('');
  }

  function badgeFor(name){
    const st = responderState[name];
    if(st.offerStatus === 'pending') return { cls:'pending', text:'Offer sent — awaiting response' };
    if(st.offerStatus === 'accepted') return { cls:'active', text:'Active' };
    const s = statsFor(name);
    if(s.quiet) return { cls:'quiet', text:'Quiet — no offers sent recently' };
    if(s.trend === 'Rising') return { cls:'busy', text:'Busy week' };
    return { cls:'steady', text:'Steady' };
  }

  function renderResponderCard(name){
    const s = statsFor(name);
    const badge = badgeFor(name);
    const st = responderState[name];
    const interactive = name === 'Meteor Mite';
    let controls = '';
    if(interactive){
      if(st.offerStatus === 'none'){
        controls = `<div class="actions"><button class="primary" onclick="triggerIncident('${name}')">New incident comes in →</button></div>`;
      } else {
        controls = `<div class="actions">
          <button class="ghost" onclick="switchToResponder('${name}')">Open in Responder View →</button>
          <button class="ghost" onclick="resetResponder('${name}')">↺ Reset demo</button>
        </div>`;
      }
    }
    return `
      <div class="card ${badge.cls === 'quiet' ? 'quiet' : (badge.cls === 'busy' ? 'busy' : '')}">
        <div class="card-top">
          <div>
            <div class="name click" onclick="switchToResponder('${name}')">${name}</div>
            <div class="meta">Handler: ${HANDLER_OF[name]} · last offer sent ${fmtDate(s.last[0])}</div>
          </div>
          <div class="badge ${badge.cls}">${badge.text}</div>
        </div>
        <div class="sparkline">${sparkHTML(s.weeks)}</div>
        <div class="spark-labels"><span>${fmtDate(s.first[0])}</span><span>${fmtDate(s.last[0])}</span></div>
        <div class="stat-row">
          <div>Pings sent, last week<b>${s.lastSent}</b></div>
          <div>Weeks without an offer<b>${s.weeksQuiet}</b></div>
          <div>Availability<b>${st.availability === 'available' ? 'Available' : 'Unavailable'}</b></div>
        </div>
        ${name === 'Meteor Mite' ? `<div class="kip-line">"Mite's been texting me all week asking if something's broken because it's so quiet." — Kip, console redesign interview</div>` : ''}
        ${name === 'The Gale' ? `<div class="kip-line">"The Gale hasn't stopped, like, at all, same week, same city." — Kip, console redesign interview</div>` : ''}
        ${controls}
      </div>`;
  }

  // ---------------- Handler View ----------------
  function renderRoster(){
    const body = document.getElementById('roster-body');
    body.innerHTML = HANDLERS.map(h => {
      return HANDLER_RESPONDERS[h].map((name, idx) => {
        const s = statsFor(name);
        const badge = badgeFor(name);
        return `<tr class="${state.selectedHandler === h ? 'sel' : ''}" onclick="selectHandler('${h}')">
          <td class="handler-cell">${idx === 0 ? h : ''}</td>
          <td>${name}</td>
          <td>${s.lastSent} sent / ${s.lastTaken} taken</td>
          <td><span class="pill ${badge.cls === 'quiet' ? 'quiet' : (s.trend === 'Rising' ? 'busy' : 'steady')}">${s.quiet ? 'Quiet' : s.trend}</span></td>
        </tr>`;
      }).join('');
    }).join('');
  }

  function selectHandler(h){
    state.selectedHandler = h;
    renderAll();
  }

  function renderHandlerView(){
    renderRoster();
    document.getElementById('detail-title').textContent = `${state.selectedHandler}'s desk`;
    document.getElementById('handler-cards').innerHTML =
      HANDLER_RESPONDERS[state.selectedHandler].map(name => renderResponderCard(name)).join('');
  }

  // ---------------- Responder View ----------------
  function renderResponderSelect(){
    const sel = document.getElementById('responder-select');
    sel.innerHTML = HANDLERS.map(h =>
      `<optgroup label="${h}">${HANDLER_RESPONDERS[h].map(name =>
        `<option value="${name}" ${state.selectedResponder === name ? 'selected' : ''}>${name}</option>`
      ).join('')}</optgroup>`
    ).join('');
  }

  function offerBlockHTML(name){
    const st = responderState[name];
    if(st.offerStatus === 'pending'){
      return `<div class="phone">
        <div class="ptitle">Incoming callout offer</div>
        <h4>New callout</h4>
        <p>Accept or decline.</p>
        <div class="actions">
          <button class="accept" onclick="respondOffer('${name}','accepted')">Accept →</button>
          <button class="decline" onclick="respondOffer('${name}','declined')">Decline →</button>
        </div>
      </div>`;
    }
    if(st.offerStatus === 'accepted'){
      return `<div class="phone"><div class="ptitle">Offer accepted</div><h4>Confirmed for this callout</h4></div>`;
    }
    if(st.offerStatus === 'declined'){
      return `<div class="phone"><div class="ptitle">Offer declined</div><h4>No response taken</h4></div>`;
    }
    return `<div class="phone-empty">No pending offers right now.</div>`;
  }

  function renderResponderView(){
    renderResponderSelect();
    const name = state.selectedResponder;
    const s = statsFor(name);
    const st = responderState[name];
    const badge = badgeFor(name);
    const recentWeeks = s.weeks.slice(-4).slice().reverse();

    document.getElementById('responder-detail').innerHTML = `
      <div class="card ${s.quiet ? 'quiet' : ''}">
        <div class="card-top">
          <div>
            <div class="name">${name}</div>
            <div class="meta">Handler: ${HANDLER_OF[name]}</div>
          </div>
          <div class="badge ${badge.cls}">${badge.text}</div>
        </div>

        <div class="avail-row">
          <span>Availability: <b>${st.availability === 'available' ? 'Available' : 'Unavailable'}</b></span>
          <button class="toggle-btn" onclick="toggleAvailability('${name}')">
            Mark ${st.availability === 'available' ? 'unavailable' : 'available'}
          </button>
        </div>

        <div class="sparkline">${sparkHTML(s.weeks)}</div>
        <div class="spark-labels"><span>${fmtDate(s.first[0])}</span><span>${fmtDate(s.last[0])}</span></div>

        <table class="mini">
          <thead><tr><th>Week</th><th>Sent</th><th>Taken</th></tr></thead>
          <tbody>${recentWeeks.map(w => `<tr><td>${fmtDate(w[0])}</td><td>${w[3]}</td><td>${w[4]}</td></tr>`).join('')}</tbody>
        </table>

        ${offerBlockHTML(name)}

        ${name === 'Meteor Mite' ? logHTML(st.log) : ''}
      </div>`;
  }

  function toggleAvailability(name){
    const st = responderState[name];
    st.availability = st.availability === 'available' ? 'unavailable' : 'available';
    renderAll();
  }

  // ---------------- Quiet-responder flow (Meteor Mite) ----------------
  function triggerIncident(name){
    responderState[name].offerStatus = 'pending';
    addLog(name, 'New callout offer sent.');
    renderAll();
  }

  function respondOffer(name, outcome){
    responderState[name].offerStatus = outcome;
    addLog(name, outcome === 'accepted' ? 'Accepted the callout.' : 'Declined the callout.');
    renderAll();
  }

  function resetResponder(name){
    responderState[name] = { availability: 'available', offerStatus: 'none', log: [] };
    renderAll();
  }

  function addLog(name, text){
    const now = new Date();
    responderState[name].log.unshift({ t: now.toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' }), text });
  }

  function logHTML(log){
    if(!log.length) return `<div class="log"><h3>Activity</h3><ul><li class="empty">Nothing yet this week.</li></ul></div>`;
    return `<div class="log"><h3>Activity</h3><ul>${log.map(l => `<li><span class="t">${l.t}</span><span>${l.text}</span></li>`).join('')}</ul></div>`;
  }

  function switchToResponder(name){
    state.selectedResponder = name;
    setView('responder');
  }

  // ---------------- History View ----------------
  function renderHistory(){
    let rows = RESPONDERS.map(name => ({ name, s: statsFor(name) }));
    if(state.historySort === 'name') rows.sort((a,b) => a.name.localeCompare(b.name));
    if(state.historySort === 'last') rows.sort((a,b) => b.s.lastSent - a.s.lastSent);
    if(state.historySort === 'trend'){
      const order = { Rising:0, Steady:1, Falling:2, Quiet:3 };
      rows.sort((a,b) => order[a.s.trend] - order[b.s.trend]);
    }
    document.getElementById('history-body').innerHTML = rows.map(({ name, s }) => `
      <tr onclick="switchToResponder('${name}')">
        <td>${name}</td>
        <td class="handler-cell">${HANDLER_OF[name]}</td>
        <td><div class="sparkline small">${sparkHTML(s.weeks, 26)}</div></td>
        <td>${s.lastSent} / ${s.lastTaken}${s.acceptRate !== null ? ` (${s.acceptRate}%)` : ''}</td>
        <td><span class="pill ${s.quiet ? 'quiet' : (s.trend === 'Rising' ? 'busy' : 'steady')}">${s.trend}</span></td>
      </tr>`).join('');

    document.querySelectorAll('.sort-btn').forEach(b => b.classList.toggle('on', b.dataset.sort === state.historySort));
  }

  document.querySelectorAll('.sort-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      state.historySort = btn.dataset.sort;
      renderHistory();
    });
  });

  // ---------------- Nav ----------------
  function setView(view){
    state.view = view;
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.view === view));
    document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === `view-${view}`));
    renderAll();
  }
  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => setView(t.dataset.view)));

  document.getElementById('responder-select').addEventListener('change', e => {
    state.selectedResponder = e.target.value;
    renderResponderView();
  });

  function renderAll(){
    renderHandlerView();
    if(state.view === 'responder') renderResponderView();
    renderHistory();
  }

  setView('handler');
</script>

</body>
</html>
